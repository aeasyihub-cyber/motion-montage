<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>motion-montage · voice-kinetic template</title>
<!--
  VOICE-KINETIC TEMPLATE — the voice is the clock.
  timeline.js (from voice/align.py) gives every word a start/end. Every reveal, highlight,
  strike and cut is keyed to MM.at('word') — never to hand-typed seconds.
  Replace the scenes with your own; keep the grammar.
-->
<style>
@font-face { font-family: 'Inter Tight'; src: url(fonts/InterTight.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Fraunces'; src: url(fonts/Fraunces.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Fraunces'; src: url(fonts/Fraunces-Italic.woff2) format('woff2'); font-weight: 100 900; font-style: italic; }
@font-face { font-family: 'JetBrains Mono'; src: url(fonts/JetBrainsMono-500.woff2) format('woff2'); font-weight: 500; }
:root {
  /* STYLE TOKENS — swap for a preset from references/style-presets.md */
  --paper: #F3EEE4; --ink: #15171B; --accent: #F2C94C; --accent2: #FF5A47; --dark1: #7A3FB0; --dark2: #3A1658;
  --sans: 'Inter Tight', system-ui, sans-serif; --serif: 'Fraunces', Georgia, serif; --mono: 'JetBrains Mono', monospace;
}
html, body { margin: 0; background: #000; }
#frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--sans); color: var(--ink); background: var(--paper); }
.scene { position: absolute; inset: 0; overflow: hidden; }
.layer { position: absolute; inset: 0; }
.paper { background: var(--paper); }
.dark { background: radial-gradient(120% 90% at 50% 30%, var(--dark1), var(--dark2)); color: #fff; }
.abs { position: absolute; }
.big { font-weight: 850; letter-spacing: -.045em; line-height: .92; }
.hl { position: relative; display: inline-block; z-index: 0; }
.hl .hl-bg { position: absolute; left: -.08em; right: -.08em; top: .08em; bottom: .02em; background: var(--accent); transform: scaleX(0); z-index: -1; border-radius: .06em; }
.strike { position: absolute; left: -3%; right: -3%; top: 50%; height: 14px; margin-top: -7px; background: var(--accent2); border-radius: 99px; transform: scaleX(0); }
.sticker { display: inline-block; background: var(--accent); color: var(--ink); padding: .02em .22em .08em; border-radius: .12em; font-family: var(--serif); font-style: italic; font-weight: 800; }
#caps { position: absolute; left: 90px; right: 90px; top: 1540px; text-align: center; z-index: 50; }
#caps .box { display: inline-block; background: rgba(12,12,14,.84); color: #fff; font: 500 44px/1.25 var(--sans); padding: 14px 30px; border-radius: 20px; }
#caps .cw { display: inline-block; opacity: .55; } #caps .cw.said { opacity: 1; }
#caps .cw.key.said { background: #fff; color: var(--ink); border-radius: 8px; padding: 0 .15em; }
#grain { position: absolute; inset: 0; width: 1080px; height: 1920px; pointer-events: none; z-index: 999; opacity: .09; mix-blend-mode: multiply; }
#wave { display: flex; align-items: center; gap: 10px; height: 260px; }
#wave i { display: block; width: 14px; border-radius: 99px; background: var(--ink); }
#wave i:nth-child(2n) { background: var(--accent2); }
</style>
</head>
<body>
<div id="frame">

  <!-- S1 · hook — words land as spoken, the key word gets the marker -->
  <section class="scene paper" id="s1">
    <div class="layer" data-depth="1">
      <div class="abs big" id="s1t" style="left:72px;top:600px;width:940px;font-size:142px">
        <span class="qc">This video</span><br>
        <span class="qc">never touched</span><br>
        <span class="qc">an <span class="hl" id="s1hl"><i class="hl-bg"></i>editing</span></span><br>
        <span class="qc" style="font-family:var(--serif);font-style:italic;font-weight:400">app.</span>
      </div>
    </div>
  </section>

  <!-- S2 · negations — each struck through the moment it is said -->
  <section class="scene dark" id="s2">
    <div class="layer" data-depth="1">
      <div class="abs big" style="left:72px;top:700px;width:940px;font-size:168px">
        <div class="qc" id="s2a">No <span style="position:relative;display:inline-block" id="s2aw">camera.<i class="strike"></i></span></div>
        <div class="qc" id="s2b" style="margin-top:.12em">No <span style="position:relative;display:inline-block" id="s2bw">designer.<i class="strike"></i></span></div>
      </div>
    </div>
  </section>

  <!-- S3 · payoff — giant key word + a waveform that reads the real voice -->
  <section class="scene paper" id="s3">
    <div class="layer" data-depth="1">
      <div class="abs big" style="left:72px;top:470px;width:940px;font-size:150px">
        <div class="qc" id="s3a">Just</div>
        <div style="margin-top:.18em"><span class="sticker qc" id="s3code" style="font-size:300px">code</span></div>
        <div class="qc" id="s3b" style="margin-top:.15em">and a voice.</div>
      </div>
      <div class="abs" id="wave" style="left:72px;top:1300px;width:936px"></div>
    </div>
  </section>

  <div id="caps"><span class="box"></span></div>
  <canvas id="grain" width="540" height="960"></canvas>
</div>

<script src="timeline.js"></script>
<script src="voice-env.js" onerror="void 0"></script>
<script src="lib/motion.js"></script>
<script src="lib/stage.js"></script>
<script src="lib/text.js"></script>
<script src="lib/transitions.js"></script>
<script>
const { $, $$, set, prog, kf, ease, spring, mix, clamp, text: T, at, endOf } = MM;
MM.loadTimeline(window.TIMELINE);
const HOLD = 1.2;                                   // CTA hold after the last word
const DUR = +(MM.TL.duration + HOLD).toFixed(2);
window.COMP = { W: 1080, H: 1920, fps: 60, duration: DUR };

// cuts sit 0.10 s BEFORE the first word of the next line (the eye arrives just ahead of the ear)
const C1 = MM.TL.markers.nocam - 0.1, C2 = MM.TL.markers.code - 0.1;
const S = [
  { el: $('#s1'), start: 0, end: C1 },
  { el: $('#s2'), start: C1, end: C2 },
  { el: $('#s3'), start: C2, end: DUR },
];
const CUTS = [
  { type: 'panel', dur: 0.6 },                       // colour change = the cut
  { type: 'push', dur: 0.42, dir: 'up' },
];
let P = {};

window.setup = async function () {
  P.s1 = T.split($('#s1t'), 'words');                // includes the .hl as one unit
  P.s2a = T.split($('#s2a'), 'words'); P.s2b = T.split($('#s2b'), 'words');
  P.s3a = T.split($('#s3a'), 'words'); P.s3b = T.split($('#s3b'), 'words');
  const wave = $('#wave');
  for (let i = 0; i < 41; i++) wave.appendChild(document.createElement('i'));
  P.bars = Array.from(wave.children);
  MM.grain($('#grain'), 1, 255);
  // sound cues tied to words
  MM.cue(at('editing'), 'pop');
  MM.cue(C1, 'whoosh');
  MM.cue(endOf('camera') - 0.1, 'swish'); MM.cue(endOf('designer') - 0.1, 'swish');
  MM.cue(C2, 'whoosh', { pitch: 1.3 });
  MM.cue(at('code'), 'hit');
};

// words of a line in order → their spoken start times
const times = (list) => list.map(([w, n = 1]) => at(w, n));

window.render = function (t) {
  MM.edit(t, S, CUTS);
  set($('#frame'), { scale: 1 + Math.sin(t * 0.9) * 0.004 });   // breathing — never fully still

  // S1 — every word appears ON its spoken onset; slow push-in keeps the frame alive between words
  if (t < C1 + 0.5) {
    MM.camera($('#s1'), { zoom: kf(t, [[0, 1.0], [C1, 1.05, ease.glide]]), y: kf(t, [[0, 0], [C1, -30, ease.glide]]) });
    T.onWords(P.s1, t, times([['This'], ['video'], ['never'], ['touched'], ['an'], ['editing'], ['app']]), 'rise');
    T.highlight($('#s1hl'), t, at('editing') + 0.05, { dur: 0.32 });
  }
  // S2
  if (t > C1 - 0.5 && t < C2 + 0.5) {
    MM.camera($('#s2'), MM.handheld(4, t, 5));
    T.onWords(P.s2a, t, times([['No', 1], ['camera']]), 'pop');
    T.onWords(P.s2b, t, times([['No', 2], ['designer']]), 'pop');
    T.strike($('#s2aw'), t, endOf('camera') - 0.12, { dimTo: 0.4 });
    T.strike($('#s2bw'), t, endOf('designer') - 0.12, { dimTo: 0.4 });
  }
  // S3
  if (t > C2 - 0.5) {
    MM.camera($('#s3'), { zoom: kf(t, [[C2, 1.04], [DUR, 1.0, ease.glide]]) });
    T.onWords(P.s3a, t, times([['Just']]), 'rise');
    const k = t - at('code');
    set($('#s3code'), { scale: k < 0 ? 0 : spring.pop(k), rot: k < 0 ? -8 : mix(-8, -3, spring.pop(k)), origin: '30% 70%' });
    T.onWords(P.s3b, t, times([['and'], ['a'], ['voice']]), 'rise');
    // waveform: real voice amplitude if voice-env.js exists, else a synthetic envelope from word timing
    const f = Math.floor(t * 60), env = window.VOICE_ENV;
    const speaking = MM.TL.words.some((w) => t >= w.s && t <= w.e);
    const amp = env ? (env[f] || 0) : (speaking ? 0.6 + 0.4 * Math.abs(Math.sin(t * 23)) : 0.05);
    const show = prog(t, at('voice') - 0.2, 0.4);
    P.bars.forEach((b, i) => {
      const c = 1 - Math.abs(i - 20) / 21;
      const h = 8 + 240 * amp * c * (0.55 + 0.45 * Math.abs(Math.sin(i * 1.9 + f * 0.21)));
      set(b, { opacity: show }); b.style.height = (h * show + 8).toFixed(1) + 'px';
    });
  }
  // captions: hidden here because every spoken word is already big on screen (no duplicates).
  T.captions($('#caps .box'), t, { hideWhen: () => window.CAPTIONS !== 'always' });
  return MM.flush();
};
</script>
</body>
</html>
